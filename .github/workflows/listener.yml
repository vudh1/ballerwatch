name: Telegram listener

on:
  workflow_dispatch:
    inputs:
      telegram_update_b64:
        description: "Base64 Telegram update from webhook"
        required: false
        type: string
      history_event_b64:
        description: "Condensed-history event from an authenticated fast path"
        required: false
        type: string
      web_settings_event_b64:
        description: "Authenticated owner settings update from the web app"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ballerwatch-listener
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: production
          fetch-depth: 1

      - name: Pull runtime state from GitHub branch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node shared/runtime-state.mjs pull listener

      - name: Listen for Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          OWNER_RSVP_NAME: ${{ secrets.OWNER_RSVP_NAME }}
          UPSTREAM_ENDPOINT: ${{ secrets.UPSTREAM_ENDPOINT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_UPDATE_B64: ${{ inputs.telegram_update_b64 }}
          CHAT_HISTORY_EVENT_B64: ${{ inputs.history_event_b64 }}
          WEB_SETTINGS_EVENT_B64: ${{ inputs.web_settings_event_b64 }}
        run: node listener/bot.mjs

      - name: Push runtime state to GitHub branch
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node shared/runtime-state.mjs push listener

      - name: Remove local runtime state
        if: always()
        run: |
          node shared/runtime-state.mjs clean listener
          rm -f league/teams.json
