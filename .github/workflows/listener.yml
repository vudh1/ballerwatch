name: Telegram listener

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ballerwatch-listener
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Listen for Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          OWNER_RSVP_NAME: ${{ secrets.OWNER_RSVP_NAME }}
          UPSTREAM_ENDPOINT: ${{ secrets.UPSTREAM_ENDPOINT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_FREE_TIER_ONLY: ${{ secrets.GROQ_FREE_TIER_ONLY }}
          # This workflow is dispatched every minute. A long poll only keeps
          # the runner alive; a short poll lets the next run pick up anything
          # that arrives later in the minute.
          TELEGRAM_POLL_TIMEOUT: "3"
        run: node listener/bot.mjs

      - name: Remove plaintext league team config
        if: always()
        run: rm -f league/teams.json

      - name: Detect generated changes
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- state/listener.json league requests)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No listener state changes."
          fi

      - name: Verify public state before committing
        if: steps.changes.outputs.changed == 'true'
        run: node privacy-audit.mjs

      - name: Persist listener and encrypted league team state
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- state/listener.json league requests
          git commit -m "Update Telegram listener state"
          STATE_COMMIT="$(git rev-parse HEAD)"

          for attempt in 1 2 3 4; do
            git fetch --depth=1 origin main
            git reset --hard origin/main

            if ! git cherry-pick -X theirs "$STATE_COMMIT"; then
              git cherry-pick --abort || true
              echo "Could not replay generated state; retrying ($attempt/4)."
              sleep $((attempt * 2))
              continue
            fi

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another workflow; retrying ($attempt/4)."
            sleep $((attempt * 2))
          done

          echo "Failed to persist state after 4 push attempts."
          exit 1
