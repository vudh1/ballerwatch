name: Telegram listener

on:
  workflow_dispatch:
    inputs:
      telegram_update_b64:
        description: "Base64 Telegram update from webhook"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ballerwatch-listener
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Pull runtime state from Cloudflare KV
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node shared/runtime-state.mjs pull listener

      - name: Listen for Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          OWNER_RSVP_NAME: ${{ secrets.OWNER_RSVP_NAME }}
          UPSTREAM_ENDPOINT: ${{ secrets.UPSTREAM_ENDPOINT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_UPDATE_B64: ${{ inputs.telegram_update_b64 }}
          TELEGRAM_POLL_TIMEOUT: "3"
        run: node listener/bot.mjs

      - name: Push runtime state to Cloudflare KV
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node shared/runtime-state.mjs push listener

      - name: Remove local runtime state
        if: always()
        run: |
          node shared/runtime-state.mjs clean listener
          rm -f league/teams.json
