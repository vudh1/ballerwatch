name: Deploy Calendar bridge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      pair_calendar:
        description: "Pair the intended Calendar after deploy"
        required: false
        default: false
        type: boolean
      purge_all:
        description: "Factory-reset BallerWatch data after deploy"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ballerwatch-calendar-bridge-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || 'production' }}
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify required secrets are available
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          GOOGLE_CALENDAR_WEBHOOK_URL: ${{ secrets.GOOGLE_CALENDAR_WEBHOOK_URL }}
          GOOGLE_CALENDAR_WEBHOOK_SECRET: ${{ secrets.GOOGLE_CALENDAR_WEBHOOK_SECRET }}
        run: |
          test -n "$CLASPRC_JSON" || { echo "Missing CLASPRC_JSON secret"; exit 1; }
          test -n "$APPS_SCRIPT_ID" || { echo "Missing APPS_SCRIPT_ID secret"; exit 1; }
          test -n "$APPS_SCRIPT_DEPLOYMENT_ID" || { echo "Missing APPS_SCRIPT_DEPLOYMENT_ID secret"; exit 1; }
          test -n "$GOOGLE_CALENDAR_WEBHOOK_URL" || { echo "Missing GOOGLE_CALENDAR_WEBHOOK_URL secret"; exit 1; }
          test -n "$GOOGLE_CALENDAR_WEBHOOK_SECRET" || { echo "Missing GOOGLE_CALENDAR_WEBHOOK_SECRET secret"; exit 1; }

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-clasp-3.4.1

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1 --prefer-offline --no-audit --no-fund

      - name: Prepare private Apps Script workspace
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          mkdir -p .runtime/apps-script
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s"}' "$APPS_SCRIPT_ID" > .runtime/apps-script/.clasp.json
          chmod 600 "$HOME/.clasprc.json" .runtime/apps-script/.clasp.json

      - name: Pull existing project and replace Calendar bridge code
        working-directory: .runtime/apps-script
        run: |
          clasp pull
          cp ../../league/google_apps_script/Code.gs ./Code.js
          clasp push --force

      - name: Redeploy existing web app without changing its URL
        working-directory: .runtime/apps-script
        env:
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          clasp create-deployment             --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID"             --description "BallerWatch ${GITHUB_SHA::7}"

      - name: Verify deployed bridge responds
        env:
          GOOGLE_CALENDAR_WEBHOOK_URL: ${{ secrets.GOOGLE_CALENDAR_WEBHOOK_URL }}
        run: |
          response="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 3 "$GOOGLE_CALENDAR_WEBHOOK_URL")"
          node -e 'const x=JSON.parse(process.argv[1]); if (x.ok !== true || x.service !== "rats-calendar-bridge" || Number(x.version) < 4) process.exit(1)' "$response"
          echo "Calendar bridge deployment verified."

      - name: Pair intended Calendar requested by release commit
        if: github.event_name == 'workflow_dispatch' && inputs.pair_calendar == true
        env:
          GOOGLE_CALENDAR_WEBHOOK_URL: ${{ secrets.GOOGLE_CALENDAR_WEBHOOK_URL }}
          GOOGLE_CALENDAR_WEBHOOK_SECRET: ${{ secrets.GOOGLE_CALENDAR_WEBHOOK_SECRET }}
          BALLERWATCH_CALENDAR_PAIR_MARKER: bw-pair-7f3c2a91
        run: node league/google-calendar-pair.mjs

      - name: One-time full reset requested by release commit
        if: github.event_name == 'workflow_dispatch' && inputs.purge_all == true
        env:
          GOOGLE_CALENDAR_WEBHOOK_URL: ${{ secrets.GOOGLE_CALENDAR_WEBHOOK_URL }}
          GOOGLE_CALENDAR_WEBHOOK_SECRET: ${{ secrets.GOOGLE_CALENDAR_WEBHOOK_SECRET }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node league/google-calendar-purge.mjs
          node shared/runtime-state.mjs purge

      - name: Remove OAuth material
        if: always()
        run: rm -rf "$HOME/.clasprc.json" .runtime/apps-script
