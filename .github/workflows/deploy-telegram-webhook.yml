name: Deploy BallerWatch Worker

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ballerwatch-telegram-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || 'production' }}
          fetch-depth: 1

      - name: Verify required core secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRON_GITHUB_PAT: ${{ secrets.CRON_GITHUB_PAT }}
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CRON_JOB_ORG_API_KEY: ${{ secrets.CRON_JOB_ORG_API_KEY }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CRON_GITHUB_PAT RELEASE_GITHUB_TOKEN CRON_JOB_ORG_API_KEY; do
            test -n "${!name}" || { echo "::error::Missing $name"; exit 1; }
          done
          if [ -z "${TRACKER_STATE_KEY:-}" ] && [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "::error::TRACKER_STATE_KEY or TELEGRAM_BOT_TOKEN is required for encrypted runtime state."
            exit 1
          fi

      - name: Verify dedicated runtime contents credential
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $RELEASE_GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/pickup/state/feed.json?ref=runtime-state")"
          test "$status" = "200" || {
            echo "::error::RELEASE_GITHUB_TOKEN cannot read encrypted runtime-state (HTTP $status).";
            exit 1;
          }

      - name: Migrate and verify GitHub runtime-state branch
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          # Every canonical runtime path is visited. Pull transparently migrates
          # legacy partial/plain projections; push refuses non-encrypted files.
          for scope in listener pickup league watchdog weather web; do
            node shared/runtime-state.mjs pull "$scope"
            node shared/runtime-state.mjs push "$scope"
            node shared/runtime-state.mjs clean "$scope"
          done
          node shared/runtime-state.mjs audit


      - name: Prepare Cloudflare runtime config
        working-directory: infra/telegram-webhook
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node prepare-config.mjs

      - name: Deploy Worker shell
        working-directory: infra/telegram-webhook
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy --config wrangler.generated.jsonc

      - name: Upload Worker secrets
        working-directory: infra/telegram-webhook
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRON_GITHUB_PAT: ${{ secrets.CRON_GITHUB_PAT }}
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          OWNER_RSVP_NAME: ${{ secrets.OWNER_RSVP_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UPSTREAM_ENDPOINT: ${{ secrets.UPSTREAM_ENDPOINT }}
        run: |
          STATE_KEY="${TRACKER_STATE_KEY:-${TELEGRAM_BOT_TOKEN:-}}"
          WEBHOOK_SECRET="$(STATE_KEY="$STATE_KEY" node -e 'const c=require("crypto");const s=process.env.STATE_KEY+"|ballerwatch-webhook-v2";process.stdout.write(c.createHash("sha256").update(s).digest("hex"))')"
          printf '%s' "$WEBHOOK_SECRET" > /tmp/telegram-webhook-secret
          node -e 'process.stdout.write(JSON.stringify({
            GITHUB_DISPATCH_TOKEN: process.env.CRON_GITHUB_PAT,
            GITHUB_CONTENTS_TOKEN: process.env.RELEASE_GITHUB_TOKEN,
            TRACKER_STATE_KEY: process.env.TRACKER_STATE_KEY || process.env.TELEGRAM_BOT_TOKEN,
            TELEGRAM_WEBHOOK_SECRET: require("fs").readFileSync("/tmp/telegram-webhook-secret","utf8"),
            ...(process.env.TELEGRAM_BOT_TOKEN ? { TELEGRAM_BOT_TOKEN: process.env.TELEGRAM_BOT_TOKEN } : {}),
            ...(process.env.TELEGRAM_CHAT_ID ? { TELEGRAM_CHAT_ID: process.env.TELEGRAM_CHAT_ID } : {}),
            ...(process.env.OWNER_RSVP_NAME ? { OWNER_RSVP_NAME: process.env.OWNER_RSVP_NAME } : {}),
            ...(process.env.GEMINI_API_KEY ? { GEMINI_API_KEY: process.env.GEMINI_API_KEY } : {}),
            ...(process.env.GROQ_API_KEY ? { GROQ_API_KEY: process.env.GROQ_API_KEY } : {}),
            ...(process.env.UPSTREAM_ENDPOINT ? { UPSTREAM_ENDPOINT: process.env.UPSTREAM_ENDPOINT } : {})
          }))' | npx --yes wrangler@4.145.0 secret bulk --config wrangler.generated.jsonc

      - name: Redeploy with secret bindings
        working-directory: infra/telegram-webhook
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 deploy --config wrangler.generated.jsonc

      - name: Verify Cloudflare cron triggers are removed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          COUNT="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/ballerwatch-telegram/schedules" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);process.stdout.write(String((x.result?.schedules||[]).length))})')"
          test "$COUNT" = "0" || { echo "::error::Expected zero Cloudflare Cron Triggers, found $COUNT"; exit 1; }
          echo "Verified zero Cloudflare Cron Triggers."

      - name: Verify Worker and configure Telegram only when enabled
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          SUBDOMAIN="$(curl --fail --silent             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"             | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).result.subdomain))')"
          BASE_URL="https://ballerwatch-telegram.$SUBDOMAIN.workers.dev"
          SECRET="$(cat /tmp/telegram-webhook-secret)"

          echo "Verifying BallerWatch Worker readiness..."
          HEALTH="$(curl --max-time 15 --fail-with-body --silent --show-error "$BASE_URL/health")"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.ok!==true || x.ready!==true || !x.version || x.version==="unknown") process.exit(1)' "$HEALTH"
          echo "Worker readiness verified."

          echo "Verifying PWA API surface and runtime-backed data..."
          PWA_CONFIG="$(curl --max-time 15 --fail-with-body --silent --show-error "$BASE_URL/web/config")"
          node -e 'const x=JSON.parse(process.argv[1]); if(x.ok!==true || x.ready!==true || !x.push || !("ready" in x.push) || !x.version || x.version==="unknown") process.exit(1)' "$PWA_CONFIG"

          for path in /web/next-game /web/calendar; do
            BODY="/tmp/ballerwatch-$(echo "$path" | tr '/' '-').json"
            HEADERS="/tmp/ballerwatch-$(echo "$path" | tr '/' '-')-headers"
            STATUS="$(curl --max-time 15 --silent --show-error \
              --dump-header "$HEADERS" \
              --output "$BODY" \
              --write-out "%{http_code}" \
              -H "Origin: https://vudh1.github.io" \
              "$BASE_URL$path")"
            test "$STATUS" = "200" || {
              echo "::error::$path failed readiness smoke with HTTP $STATUS";
              cat "$BODY";
              exit 1;
            }
            grep -qi '^access-control-allow-origin: https://vudh1.github.io' "$HEADERS" || {
              echo "::error::$path is missing the expected PWA CORS origin";
              cat "$HEADERS";
              exit 1;
            }
            node - "$path" "$BODY" <<'NODE'
const fs = require("fs");
const path = process.argv[2];
const value = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
if (value.ok !== true) process.exit(1);
if (path === "/web/calendar" && !value.calendar) process.exit(1);
if (path === "/web/next-game" && !Object.prototype.hasOwnProperty.call(value, "game")) process.exit(1);
NODE
            rm -f "$BODY" "$HEADERS"
          done
          echo "PWA runtime-backed API verified."

          echo "Verifying owner-pairing error response and CORS..."
          PAIR_HEADERS="/tmp/ballerwatch-pair-headers"
          PAIR_BODY="/tmp/ballerwatch-pair-body"
          PAIR_STATUS="$(curl --max-time 15 --silent --show-error             --dump-header "$PAIR_HEADERS"             --output "$PAIR_BODY"             --write-out "%{http_code}"             -X POST "$BASE_URL/web/owner/pair"             -H "Origin: https://vudh1.github.io"             -H "Content-Type: application/json"             --data '{"code":"000000"}')"
          test "$PAIR_STATUS" = "401" || { echo "::error::Expected invalid pair code to return 401, got $PAIR_STATUS"; cat "$PAIR_BODY"; exit 1; }
          grep -qi '^access-control-allow-origin: https://vudh1.github.io' "$PAIR_HEADERS" || { echo "::error::Pairing response is missing expected CORS origin"; cat "$PAIR_HEADERS"; exit 1; }
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.ok!==false||!x.error)process.exit(1)' "$PAIR_BODY"
          rm -f "$PAIR_HEADERS" "$PAIR_BODY"
          echo "Owner-pairing error response verified."

          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            WEBHOOK_URL="$BASE_URL/telegram"
            curl --fail --silent --show-error               -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook"               -H "content-type: application/json"               -d "$(node -e 'process.stdout.write(JSON.stringify({url:process.argv[1],secret_token:process.argv[2],allowed_updates:["message"],drop_pending_updates:false}))' "$WEBHOOK_URL" "$SECRET")"
            echo
            echo "Telegram adapter enabled: $WEBHOOK_URL"
          else
            echo "Telegram adapter disabled; PWA/API operation remains enabled."
          fi

      - name: Ensure primary GitHub schedules stay enabled
        env:
          CRON_JOB_ORG_API_KEY: ${{ secrets.CRON_JOB_ORG_API_KEY }}
          CRON_GITHUB_PAT: ${{ secrets.CRON_GITHUB_PAT }}
          BALLERWATCH_BRANCH: production
        run: node infra/external-schedules.mjs ensure-enabled-optional

      - name: Clean temporary files
        if: always()
        run: |
          rm -f /tmp/telegram-webhook-secret
          rm -f infra/telegram-webhook/wrangler.generated.jsonc
