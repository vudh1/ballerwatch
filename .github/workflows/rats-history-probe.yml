name: Temporary RATS history repair smoke

on:
  push:
    branches: [fix/rats-history-records]
    paths:
      - ".github/workflows/rats-history-probe.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Build repaired history index from public source
        env:
          TRACKER_STATE_KEY: synthetic-rats-history-smoke-key
          RATS_HISTORY_FORCE: "true"
          RATS_HISTORY_START_YEAR: "2023"
        run: node backend/league/history.mjs
      - name: Verify scored archive coverage without exposing team data
        env:
          TRACKER_STATE_KEY: synthetic-rats-history-smoke-key
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { decryptState } from "./backend/shared/state-crypto.mjs";
          const value = decryptState(JSON.parse(fs.readFileSync("league/state/history.json", "utf8")));
          const coverage = value?.coverage || {};
          console.log(JSON.stringify({
            schemaVersion: value?.schemaVersion,
            scanStartYear: value?.scanStartYear,
            scanEndYear: value?.scanEndYear,
            complete: coverage.complete,
            requestedSeasonCount: coverage.requestedSeasonCount,
            checkedSeasonCount: coverage.checkedSeasonCount,
            failedSeasonCount: coverage.failedSeasonCount,
            seasonCount: coverage.seasonCount,
            teamCount: coverage.teamCount,
            matchCount: coverage.matchCount,
            completedMatchCount: coverage.completedMatchCount,
          }));
          if (value?.schemaVersion !== 2) process.exit(1);
          if (!(coverage.seasonCount > 2)) process.exit(1);
          if (!(coverage.completedMatchCount > 0)) process.exit(1);
          NODE
