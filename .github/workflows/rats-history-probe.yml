name: Temporary RATS history source probe

on:
  push:
    branches: [fix/rats-history-records]
    paths:
      - ".github/workflows/rats-history-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe historical RATS season availability
        shell: bash
        run: |
          node <<'NODE'
          const api = "https://service.rats.team.op-dev.io/";
          const seasons = [
            "fall-2026","fall-2025","fall-2024","fall-2023","fall-2022",
            "fall-2021","fall-2020","fall-2019","fall-2018","fall-2017",
            "fall-2016","fall-2015","fall-2014","fall-2013","fall-2012",
          ];

          async function call(season) {
            const started = Date.now();
            try {
              const response = await fetch(api + "get-aggregate", {
                method: "POST",
                headers: {
                  "content-type": "application/json",
                  "user-agent": "ballerwatch-history-probe/1.0",
                },
                body: JSON.stringify({ season }),
                signal: AbortSignal.timeout(12_000),
              });
              const value = await response.json().catch(() => null);
              const events = Array.isArray(value?.events) ? value.events : [];
              const scored = events.filter((event) =>
                typeof event?.score === "string" && /^\s*\d+\s*-\s*\d+\s*$/.test(event.score));
              return {
                season,
                status: response.status,
                ms: Date.now() - started,
                teamCount: Array.isArray(value?.teams) ? value.teams.length : 0,
                eventCount: events.length,
                scoredCount: scored.length,
              };
            } catch (error) {
              return {
                season,
                status: "timeout/error",
                ms: Date.now() - started,
                error: String(error?.name || error),
              };
            }
          }

          let cursor = 0;
          async function worker() {
            while (cursor < seasons.length) {
              const index = cursor++;
              console.log(JSON.stringify(await call(seasons[index])));
            }
          }
          await Promise.all([worker(), worker()]);
          NODE
