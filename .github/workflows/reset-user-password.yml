name: Reset web user password

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RESET to replace the web user password from the temporary recovery secret"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ballerwatch-user-recovery
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: production
          fetch-depth: 1

      - name: Verify recovery inputs
        env:
          CONFIRM: ${{ inputs.confirm }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          BALLERWATCH_RECOVERY_PASSWORD: ${{ secrets.BALLERWATCH_RECOVERY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM" = "RESET" || { echo "::error::Confirmation must be RESET."; exit 1; }
          test -n "$TRACKER_STATE_KEY" || { echo "::error::TRACKER_STATE_KEY is required."; exit 1; }
          test -n "$BALLERWATCH_RECOVERY_PASSWORD" || {
            echo "::error::Set the temporary BALLERWATCH_RECOVERY_PASSWORD repository secret before running recovery.";
            exit 1;
          }

      - name: Pull encrypted user state
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node shared/runtime-state.mjs pull user

      - name: Reset password and revoke existing sessions
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          BALLERWATCH_RECOVERY_PASSWORD: ${{ secrets.BALLERWATCH_RECOVERY_PASSWORD }}
        run: node shared/user-recovery.mjs reset

      - name: Persist encrypted user state
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node shared/runtime-state.mjs push user

      - name: Remove transient state
        if: always()
        run: |
          node shared/runtime-state.mjs clean user || true
          rm -rf .runtime
