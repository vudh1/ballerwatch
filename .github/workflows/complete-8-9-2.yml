name: Complete BallerWatch 8.9.2 promotion

# Version-pinned one-time handoff to the audited production workflow.
# This cannot publish or deploy directly. Validate code, exact candidate,
# secret readiness, Worker live health and GitHub Pages gates still apply.
on:
  workflow_run:
    workflows: ["Validate code"]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: ballerwatch-8-9-2-handoff
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Require validated current BallerWatch 8.9.2 ledger
        id: candidate
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          ledger_sha="$(git log -1 --format=%H HEAD -- features/versions.json)"
          version="$(node -p 'JSON.parse(require("fs").readFileSync("features/versions.json","utf8")).currentVersion')"
          if [ "$head_sha" != "$VALIDATED_SHA" ] || [ "$version" != "8.9.2" ] || ! git merge-base --is-ancestor "$ledger_sha" "$head_sha"; then
            echo "Not a validated BallerWatch 8.9.2 candidate. No production action."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -n "$GH_TOKEN" || { echo "::error::RELEASE_GITHUB_TOKEN missing"; exit 1; }
          if gh release view v8.9.2 --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx false; then
            echo "Published v8.9.2 already exists. No duplicate promotion."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "dispatch=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch audited production promotion
        if: steps.candidate.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: gh workflow run promote-release.yml --repo "$GITHUB_REPOSITORY" --ref main
