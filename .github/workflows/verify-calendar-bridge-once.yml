name: One-time Calendar bridge verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-calendar-bridge-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify existing Calendar bridge
        env:
          GOOGLE_CALENDAR_WEBHOOK_URL: ${{ secrets.GOOGLE_CALENDAR_WEBHOOK_URL }}
        run: |
          test -n "$GOOGLE_CALENDAR_WEBHOOK_URL"
          response="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$GOOGLE_CALENDAR_WEBHOOK_URL")"
          node -e 'const x=JSON.parse(process.argv[1]); if (x.ok !== true || x.service !== "rats-calendar-bridge") process.exit(1)' "$response"
          echo "Existing Calendar bridge is healthy."
