name: Review safe feedback summaries

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/review-feedback.yml"
      - "scripts/review-feedback.mjs"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          path: source

      - name: Check out encrypted runtime state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: runtime-state
          path: runtime

      - name: Review sanitized engineering summaries
        working-directory: source
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node scripts/review-feedback.mjs ../runtime
