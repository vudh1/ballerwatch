name: Refresh RATS scouting cache

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  # Bootstrap the encrypted report as soon as this workflow is updated.
  push:
    branches: [main]
    paths:
      - '.github/workflows/scouting-index.yml'
  # A newly promoted release must not wait for the next hourly schedule.
  workflow_run:
    workflows: ["Promote production release"]
    types: [completed]

permissions:
  contents: write

# The regular league failover job edits the same encrypted runtime branch.
concurrency:
  group: ballerwatch-league
  cancel-in-progress: false

jobs:
  index:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: production
          fetch-depth: 1

      - name: Pull encrypted league state
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node backend/shared/runtime-state.mjs pull league

      - name: Refresh published RATS scores (hourly)
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node backend/league/history.mjs

      # Keep model refresh in the same serialized writer as hourly snapshots.
      # Separate pending jobs in one Actions concurrency group replace each
      # other, even when cancel-in-progress is false.
      - name: Evaluate weekly scouting model when due
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node backend/league/scouting-model.mjs --if-due

      - name: Prepare compact encrypted scouting report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node backend/league/scouting-index.mjs

      - name: Publish encrypted current scouting snapshot
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node backend/shared/runtime-state.mjs push league

      - name: Remove local runtime data
        if: always()
        run: |
          node backend/shared/runtime-state.mjs clean league
          rm -rf .runtime
