name: Request BallerWatch 11.2.1 production promotion

# One-time request only. The existing protected promotion workflow enforces
# release validation, Worker readiness and Pages deployment gates.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/request-release-11.2.1.yml"

permissions:
  contents: read

jobs:
  request:
    if: "startsWith(github.event.head_commit.message, 'chore(release): request 11.2.1 production promotion')"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify immutable 11.2.1 candidate and deployment readiness
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::Missing RELEASE_GITHUB_TOKEN"; exit 1; }
          candidate="$(git log -1 --format=%H HEAD -- features/versions.json)"
          test "$candidate" = "1994988d75aff6ba8ae10a9c07f22b649f52fb81" || {
            echo "::error::Candidate release commit unexpectedly changed."
            exit 1
          }
          version="$(git show "$candidate:features/versions.json" | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>process.stdout.write(JSON.parse(s).currentVersion))')"
          test "$version" = "11.2.1" || {
            echo "::error::Candidate version is not 11.2.1."
            exit 1
          }
          successful="$(gh api -X GET "/repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs" \
            -f head_sha="$candidate" -f status=completed -f per_page=40 \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          test "$successful" -ge 1 || {
            echo "::error::The exact release commit has no successful CI."
            exit 1
          }

      - name: Request existing release-gated production workflow
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run promote-release.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched protected promotion. Worker and Pages readiness gates remain mandatory."
