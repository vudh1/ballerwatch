# Temporary diagnostics for issue #226. Remove before release.
name: RATS public source diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rats-public-source-diagnostic.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned headless browser
        run: |
          npm install --prefix /tmp/ballerwatch-source-probe --no-save playwright@1.56.1
          node /tmp/ballerwatch-source-probe/node_modules/playwright/cli.js install --with-deps chromium
      - name: Inspect public RATS schedule network (no secrets or response bodies)
        run: |
          node --input-type=module <<'NODE'
          const {chromium}=await import("/tmp/ballerwatch-source-probe/node_modules/playwright/index.mjs");
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          const seen=new Set();
          page.on("requestfailed",request=>{
            const u=new URL(request.url());
            if(/rats|op-dev|gametimehero/i.test(u.hostname))
              console.log("PUBLIC FAILED REQUEST",request.method(),u.hostname+u.pathname,request.failure()?.errorText?.slice(0,120));
          });
          page.on("response",response=>{
            const u=new URL(response.url());
            if(/rats.team.op-dev.io|service.rats.team.op-dev.io/i.test(u.hostname)){
              const path=u.hostname+u.pathname;
              if(!seen.has(path) && seen.size<60){
                seen.add(path);
                console.log("RATS REQUEST",response.request().method(),response.status(),path,response.headers()["content-type"]||"");
              }
            }
          });
          try{
            const res=await page.goto("https://seattlerats.org/schedule--standings",{waitUntil:"domcontentloaded",timeout:30000});
            await page.waitForTimeout(10000);
            console.log("RATS PAGE STATUS",res?.status());
            console.log("EMBEDS",await page.locator("iframe").evaluateAll(els=>els.map(el=>{
              try{const u=new URL(el.src);return u.hostname+u.pathname;}catch{return "";}
            })));
            console.log("RATS DOM TAIL",await page.locator("body").innerText().then(t=>t.slice(-550).replace(/\\s+/g," ")));
          }catch(error){console.log("RATS PAGE ERROR",String(error.message).slice(0,180));}
          for(const name of ["schedule","standings"]){
            try{
              const u="https://rats.team.op-dev.io/lib/"+name+".js";
              const response=await fetch(u,{signal:AbortSignal.timeout(9000)});
              const js=await response.text();
              const domains=[...new Set((js.match(/https?:\\/\\/[^"'`\\s)]+/g)||[])
                .map(x=>{try{return new URL(x).hostname}catch{return ""}}).filter(Boolean))];
              console.log("RATS LIB",name,"status",response.status,"chars",js.length,
                "domains",domains.slice(0,12),"has-aggregate",js.includes("get-aggregate"),
                "has-service-host",js.includes("service.rats.team.op-dev.io"));
              const paths=[...new Set((js.match(/get-(?:aggregate|schedule)|\/api\/[a-z-]+|postMessage|fetch\\(/g)||[]))].slice(0,12);
              console.log("RATS LIB TOKENS",name,paths);
            }catch(e){console.log("RATS LIB ERROR",name,String(e.message).slice(0,140));}
          }
          await browser.close();
          NODE
