# Temporary public data adapter discovery for #226; remove before merge.
name: RATS public source diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rats-public-source-diagnostic.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Inspect public RATS widget scripts (no secrets or writes)
        run: |
          node --input-type=module <<'NODE'
          const files=["/lib/seasons.js","/lib/load.js","/lib/gviz.js","/lib/parse.js","/lib/schedule.js","/lib/standings.js","/app.js"];
          for(const path of files){
            try{
              const response=await fetch("https://rats.team.op-dev.io"+path,{signal:AbortSignal.timeout(8000)});
              const js=await response.text();
              console.log("BEGIN PUBLIC SCRIPT",path,response.status,js.length);
              console.log(js.slice(0,10000));
              console.log("END PUBLIC SCRIPT",path);
            }catch(error){console.log("FAILED PUBLIC SCRIPT",path,String(error.message).slice(0,140));}
          }
          NODE
