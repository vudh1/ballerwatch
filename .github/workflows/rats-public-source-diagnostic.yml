# Temporary public-source comparison, no state changes; remove before merge.
name: RATS public source diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rats-public-source-diagnostic.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Compare adapter to live RATS official sheet scores
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { parsePublicGviz, parsePublicSeasonRegistry, publishedRatsCall, PUBLIC_RATS_REGISTRY } from "./backend/league/rats-public-source.mjs";
          const registry = parsePublicSeasonRegistry(await (await fetch(PUBLIC_RATS_REGISTRY)).text());
          const season=registry.get("fall-2026");assert.ok(season);
          const url="https://docs.google.com/spreadsheets/d/"+season.sheetId+"/gviz/tq?tqx=out:json&headers=1&sheet=Field%20List";
          const raw=parsePublicGviz(await (await fetch(url)).text());
          const rows=raw.rows.map(row=>Object.fromEntries(raw.headers.map((header,i)=>[header,row[i]])));
          const aggregate=await publishedRatsCall("get-aggregate",{season:"fall-2026"});
          assert.ok(aggregate.teams.length>200,"current RATS official teams are present");
          assert.ok(aggregate.events.length>500,"current RATS official events are present");
          const sourceScored=rows.filter(row=>row.Home&&row.Away&&row["Home Color"]&&row["Away Color"]&&
            Number.isInteger(row["Home Score"])&&Number.isInteger(row["Away Score"]));
          const scored=aggregate.events.filter(e=>e.score);
          assert.ok(scored.length>300,"current RATS scores populated");
          const compared=[];
          for(const row of sourceScored){
            const found=scored.find(e=>e.home_team_name===String(row.Home).trim()&&
              e.away_team_name===String(row.Away).trim()&&
              e.score===String(row["Home Score"])+"-"+String(row["Away Score"]));
            if(found && !compared.some(x=>x===found)) compared.push(found);
            if(compared.length>=2)break;
          }
          assert.equal(compared.length,2,"two public score pairs must match the RATS published table");
          console.log("LIVE RATS ADAPTER VERIFIED",JSON.stringify({
            officialSheet:"fall-2026",teams:aggregate.teams.length,events:aggregate.events.length,
            scored:scored.length,compared:compared.map(e=>({
              date:e.start_date,home:e.home_team_name,away:e.away_team_name,score:e.score,
            })),
          }));
          NODE
