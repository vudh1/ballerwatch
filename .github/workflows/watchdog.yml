name: System watchdog

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ballerwatch-watchdog
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify workflows, validation, encryption and state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          TELEGRAM_WEBHOOK_HEALTH_URL: https://ballerwatch-telegram.vudhone.workers.dev/health
        run: node watchdog/watchdog.mjs

      - name: Persist encrypted watchdog state
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- state/watchdog.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state/watchdog.json
          git commit -m "Update watchdog health state"
          STATE_COMMIT="$(git rev-parse HEAD)"
          for attempt in 1 2 3 4; do
            git fetch --depth=1 origin main
            git reset --hard origin/main
            if ! git cherry-pick -X theirs "$STATE_COMMIT"; then
              git cherry-pick --abort || true
              echo "Could not replay generated state; retrying ($attempt/4)."
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another workflow; retrying ($attempt/4)."
            sleep $((attempt * 2))
          done
          echo "Failed to persist state after 4 push attempts."
          exit 1
