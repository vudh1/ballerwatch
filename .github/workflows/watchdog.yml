name: System watchdog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      external_fallback:
        description: "Optional manual/fallback execution flag"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: ballerwatch-watchdog
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: production
          fetch-depth: 1

      - name: Restore encrypted watchdog state cache
        uses: actions/cache/restore@v4
        with:
          path: .runtime/failover/watchdog.json
          key: ballerwatch-runtime-watchdog-${{ github.run_id }}
          restore-keys: |
            ballerwatch-runtime-watchdog-

      - name: Pull GitHub watchdog state
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node shared/runtime-state.mjs pull watchdog

      - name: Pull game/weather runtime state
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node shared/runtime-state.mjs pull weather

      - name: Refresh 14-day match weather
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node weather/update.mjs

      - name: Persist match weather
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node shared/runtime-state.mjs push weather

      - name: Verify validation, privacy, edge health, and external schedules
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          TELEGRAM_WEBHOOK_HEALTH_URL: https://ballerwatch-telegram.vudhone.workers.dev/health
          CRON_JOB_ORG_API_KEY: ${{ secrets.CRON_JOB_ORG_API_KEY }}
        run: node watchdog/watchdog.mjs

      - name: Push GitHub watchdog state
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          BALLERWATCH_ALLOW_OFFLINE: ${{ inputs.external_fallback }}
        run: node shared/runtime-state.mjs push watchdog

      - name: Signal installed web app
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node shared/web-push.mjs send-pending

      - name: Persist Web Push subscription cleanup
        if: always()
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BALLERWATCH_ALLOW_OFFLINE: ${{ inputs.external_fallback }}
        run: node shared/runtime-state.mjs push watchdog

      - name: Build encrypted watchdog failover backup
        if: always()
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node shared/failover-state.mjs save watchdog

      - name: Save encrypted watchdog state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .runtime/failover/watchdog.json
          key: ballerwatch-runtime-watchdog-${{ github.run_id }}

      - name: Remove local watchdog state
        if: always()
        run: |
          node shared/runtime-state.mjs clean watchdog
          node shared/runtime-state.mjs clean weather
          rm -rf .runtime
