name: Validate code

on:
  push:
    paths:
      - "listener/**"
      - "pickup/*.mjs"
      - "league/*.py"
      - "shared/**"
      - "watchdog/**"
      - "manual-test.mjs"
      - "privacy-audit.mjs"
      - "infra/**"
      - "features/**"
      - "skills/**"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - name: Validate JavaScript syntax
        run: |
          node --check shared/telegram.mjs
          node --check shared/ai-fallback.mjs
          node --check shared/state-crypto.mjs
          node --check shared/runtime-state.mjs
          node --check shared/feature-requests.mjs
          node --check shared/bot-state.mjs
          node --check shared/league-teams.mjs
          node --check shared/league-state.mjs
          node --check listener/bot.mjs
          node --check pickup/update.mjs
          node --check pickup/notify.mjs
          node --check pickup/selection.mjs
          node --check watchdog/watchdog.mjs
          node --check infra/external-schedules.test.mjs
          node --check manual-test.mjs
          node --check privacy-audit.mjs
          node --check infra/external-schedules.mjs
          node --check infra/telegram-webhook/worker.mjs
          node --check infra/telegram-webhook/edge-runtime.mjs
          node --check infra/telegram-webhook/prepare-config.mjs
          node --check infra/telegram-webhook/edge-runtime.test.mjs
          node --check infra/validate-versions.mjs

      - name: Test Cloudflare edge runtime
        run: node --test infra/telegram-webhook/edge-runtime.test.mjs

      - name: Bundle Cloudflare Worker
        working-directory: infra/telegram-webhook
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/ballerwatch-worker

      - name: Validate release history
        run: node infra/validate-versions.mjs

      - name: Enforce encrypted-at-rest privacy
        run: node privacy-audit.mjs

      - name: Run request privacy regression tests
        run: node --test shared/feature-requests.test.mjs

      - name: Test external fallback scheduler rules
        run: node --test infra/external-schedules.test.mjs

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run league unit tests
        working-directory: league
        run: python -m unittest watcher_test.py calendar_gate_test.py
