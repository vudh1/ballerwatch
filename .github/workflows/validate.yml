name: Validate code

on:
  push:
    paths:
      - "listener/**"
      - "pickup/**"
      - "league/**"
      - "shared/**"
      - "watchdog/**"
      - "scripts/**"
      - "docs/**"
      - "infra/**"
      - "features/**"
      - "skills/**"
      - "tests/**"
      - ".editorconfig"
      - "STYLE_GUIDE.md"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5

      - name: Enforce repository code style
        run: node scripts/check-style.mjs

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -name '*.mjs' -not -path './node_modules/*' -print0)

      - name: Run JavaScript unit tests
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --test "$file"
          done < <(find tests -name '*.test.mjs' -print0 | sort -z)

      - name: Bundle Cloudflare Worker
        working-directory: infra/telegram-webhook
        run: npx --yes wrangler@4.145.0 deploy --dry-run --outdir /tmp/ballerwatch-worker

      - name: Validate release history
        run: node infra/validate-versions.mjs

      - name: Enforce public-repository privacy
        run: node privacy-audit.mjs

      - name: Validate Apps Script syntax
        run: |
          cp league/google_apps_script/Code.gs /tmp/ballerwatch-calendar-bridge.mjs
          node --check /tmp/ballerwatch-calendar-bridge.mjs

