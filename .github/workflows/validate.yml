name: Validate code

on:
  push:
    paths:
      - "listener/**"
      - "pickup/**"
      - "league/**"
      - "shared/**"
      - "watchdog/**"
      - "scripts/**"
      - "docs/**"
      - "infra/**"
      - "features/**"
      - "skills/**"
      - ".editorconfig"
      - "STYLE_GUIDE.md"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5

      - name: Enforce repository code style
        run: node scripts/check-style.mjs

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -name '*.mjs' -not -path './node_modules/*' -print0)

      - name: Run JavaScript unit tests
        run: |
          node --test shared/feature-requests.test.mjs
          node --test shared/ai-provider.test.mjs
          node --test shared/runtime-state.test.mjs
          node --test watchdog/scheduler-check.test.mjs
          node --test shared/intent-index.test.mjs
          node --test shared/failover-state.test.mjs
          node --test infra/external-schedules.test.mjs
          node --test infra/fallback-gate.test.mjs
          node --test infra/telegram-webhook/edge-runtime.test.mjs

      - name: Bundle Cloudflare Worker
        working-directory: infra/telegram-webhook
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/ballerwatch-worker

      - name: Validate release history
        run: node infra/validate-versions.mjs

      - name: Enforce public-repository privacy
        run: node privacy-audit.mjs

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python modules
        run: python -m compileall -q league

      - name: Run league unit tests
        working-directory: league
        run: python -m unittest watcher_test.py calendar_gate_test.py
