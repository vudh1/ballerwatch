name: Validate code

on:
  push:
    branches: [main, production]
    paths:
      - "backend/pickup/**"
      - "backend/league/**"
      - "backend/shared/**"
      - "backend/watchdog/**"
      - "backend/weather/**"
      - "scripts/**"
      - "frontend/**"
      - "backend/infra/**"
      - "features/**"
      - "skills/**"
      - "tests/**"
      - ".editorconfig"
      - "STYLE_GUIDE.md"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ballerwatch-validate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Enforce repository code style
        run: node scripts/check-style.mjs

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . \( -name '*.mjs' -o -name '*.js' \) -not -path './node_modules/*' -print0)

      - name: Run JavaScript unit tests
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --test "$file"
          done < <(find tests -name '*.test.mjs' -print0 | sort -z)

      # One-off read-only audit on the Drogon release PR. No canonical state,
      # keys, tokens or external EPG queries. Remove before main merge.
      - name: Measure published 28-day broadcasts versus saved Drogon channels
        if: github.event_name == 'pull_request' && github.head_ref == 'release/11.8.0-drogon-lineup'
        run: node scripts/audit-drogon-coverage.mjs

      - name: Bundle Cloudflare Worker
        working-directory: backend/infra/web-worker
        run: npx --yes wrangler@4.145.0 deploy --dry-run --outdir /tmp/ballerwatch-worker

      - name: Validate release history
        run: node backend/infra/validate-versions.mjs

      - name: Enforce public-repository privacy
        run: node scripts/privacy-audit.mjs

      - name: Build canonical app and legacy redirect
        run: node scripts/build-web.mjs


  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pinned browser test runner
        run: npm install --prefix /tmp/ballerwatch-browser --no-save playwright@1.56.1

      - name: Install ${{ matrix.browser }}
        run: node /tmp/ballerwatch-browser/node_modules/playwright/cli.js install --with-deps ${{ matrix.browser }}

      - name: Build canonical app and legacy compatibility assets
        run: node scripts/build-web.mjs

      - name: Verify canonical app and legacy compatibility with synthetic data
        env:
          BALLERWATCH_PLAYWRIGHT_MODULE: /tmp/ballerwatch-browser/node_modules/playwright
          BALLERWATCH_WEB_ROOT: /tmp/ballerwatch-web-build
          BALLERWATCH_BROWSERS: ${{ matrix.browser }}
        run: node tests/frontend/browser-smoke.mjs

