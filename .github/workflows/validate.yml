name: Validate code

on:
  push:
    paths:
      - "backend/pickup/**"
      - "backend/league/**"
      - "backend/shared/**"
      - "backend/watchdog/**"
      - "backend/weather/**"
      - "scripts/**"
      - "frontend/**"
      - "backend/infra/**"
      - "features/**"
      - "skills/**"
      - "tests/**"
      - ".editorconfig"
      - "STYLE_GUIDE.md"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ballerwatch-validate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Enforce repository code style
        run: node scripts/check-style.mjs

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . \( -name '*.mjs' -o -name '*.js' \) -not -path './node_modules/*' -print0)

      - name: Inspect public RATS aggregate schema
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint = "https://service.rats.team.op-dev.io/get-aggregate";
          const season = "fall-2026";
          const response = await fetch(endpoint, {
            method: "POST",
            headers: {"content-type":"application/json","user-agent":"ballerwatch-schema-review/1.0"},
            body: JSON.stringify({season}),
            signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error(`RATS schema probe HTTP ${response.status}`);
          const data = await response.json();
          const teams = Array.isArray(data?.teams) ? data.teams : [];
          const events = Array.isArray(data?.events) ? data.events : [];
          const allTeamKeys = [...new Set(teams.flatMap((item) => Object.keys(item || {})))].sort();
          const allEventKeys = [...new Set(events.flatMap((item) => Object.keys(item || {})))].sort();
          const statPattern = /win|loss|draw|tie|point|goal|score|played|record|standing/i;
          const scoreKinds = {};
          const scoreShapes = new Set();
          for (const event of events) {
            const value = event?.score;
            const kind = Array.isArray(value) ? "array" : value === null ? "null" : typeof value;
            scoreKinds[kind] = (scoreKinds[kind] || 0) + 1;
            if (value === null || value === undefined || value === "") continue;
            if (typeof value === "string" || typeof value === "number") {
              scoreShapes.add(String(value).replace(/\d/g, "#").slice(0, 80));
            } else if (value && typeof value === "object") {
              scoreShapes.add("object:" + Object.keys(value).sort().join(","));
            }
          }
          console.log("RATS_TOP_KEYS=" + JSON.stringify(Object.keys(data || {}).sort()));
          console.log("RATS_TEAM_KEYS=" + JSON.stringify(allTeamKeys));
          console.log("RATS_TEAM_STAT_KEYS=" + JSON.stringify(allTeamKeys.filter((key) => statPattern.test(key))));
          console.log("RATS_EVENT_KEYS=" + JSON.stringify(allEventKeys));
          console.log("RATS_EVENT_STAT_KEYS=" + JSON.stringify(allEventKeys.filter((key) => statPattern.test(key))));
          console.log("RATS_SCORE_KINDS=" + JSON.stringify(scoreKinds));
          console.log("RATS_SCORE_SHAPES=" + JSON.stringify([...scoreShapes].slice(0, 20)));
          console.log("RATS_COUNTS=" + JSON.stringify({teams: teams.length, events: events.length}));

          const published = [];
          for (const year of [2024, 2025, 2026, 2027]) {
            for (const name of ["winter", "spring", "summer", "fall"]) {
              const candidate = `${name}-${year}`;
              try {
                const seasonResponse = await fetch(endpoint, {
                  method: "POST",
                  headers: {"content-type":"application/json","user-agent":"ballerwatch-schema-review/1.0"},
                  body: JSON.stringify({season:candidate}),
                  signal: AbortSignal.timeout(10000),
                });
                if (!seasonResponse.ok) continue;
                const seasonData = await seasonResponse.json();
                const teamCount = Array.isArray(seasonData?.teams) ? seasonData.teams.length : 0;
                const eventCount = Array.isArray(seasonData?.events) ? seasonData.events.length : 0;
                if (teamCount || eventCount) published.push({season:candidate,teamCount,eventCount});
              } catch {}
            }
          }
          console.log("RATS_PUBLISHED_SEASON_PROBES=" + JSON.stringify(published));
          NODE

      - name: Run JavaScript unit tests
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --test "$file"
          done < <(find tests -name '*.test.mjs' -print0 | sort -z)

      - name: Bundle Cloudflare Worker
        working-directory: backend/infra/web-worker
        run: npx --yes wrangler@4.145.0 deploy --dry-run --outdir /tmp/ballerwatch-worker

      - name: Validate release history
        run: node backend/infra/validate-versions.mjs

      - name: Enforce public-repository privacy
        run: node scripts/privacy-audit.mjs

      - name: Validate Apps Script syntax
        run: |
          cp backend/league/google_apps_script/Code.gs /tmp/ballerwatch-calendar-bridge.mjs
          node --check /tmp/ballerwatch-calendar-bridge.mjs

