name: Request BallerWatch 11.2.2 production promotion

# One-time request only. Existing protected promotion, Worker readiness and
# Pages deployment must still pass before production changes.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/request-release-11.2.2.yml"

permissions:
  contents: read

jobs:
  request:
    if: "startsWith(github.event.head_commit.message, 'chore(release): request 11.2.2 production promotion')"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify immutable 11.2.2 candidate and successful main validation
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::Missing RELEASE_GITHUB_TOKEN"; exit 1; }
          candidate="$(git log -1 --format=%H HEAD -- features/versions.json)"
          test "$candidate" = "0b7ca2d13235e3f70c9f7e965c1948f3270f58ef" || {
            echo "::error::Candidate release commit changed unexpectedly."
            exit 1
          }
          version="$(git show "$candidate:features/versions.json" | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>process.stdout.write(JSON.parse(s).currentVersion))')"
          test "$version" = "11.2.2" || {
            echo "::error::Candidate version must be 11.2.2."
            exit 1
          }
          successful="$(gh api -X GET "/repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs" \
            -f head_sha="$candidate" -f status=completed -f per_page=40 \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          test "$successful" -ge 1 || {
            echo "::error::Exact release commit has no successful main validation."
            exit 1
          }

      - name: Request existing release-gated promotion
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run promote-release.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Existing promotion will enforce Worker and Pages release gates."
