name: Request BallerWatch 11.6.3 production promotion

# One-time release request. Production still uses protected promotion,
# tagged release, Worker checks and Pages verification.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/request-release-11.6.3.yml"

permissions:
  contents: read

jobs:
  request:
    if: "startsWith(github.event.head_commit.message, 'chore(release): request 11.6.3 production promotion')"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify immutable 11.6.3 candidate and successful main validation
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::Missing RELEASE_GITHUB_TOKEN"; exit 1; }
          candidate="$(git log -1 --format=%H HEAD -- features/versions.json)"
          test "$candidate" = "50a13c09cba42a570fa3a6a2f8607c91007632ed" || {
            echo "::error::Release candidate changed unexpectedly; refusing production promotion."
            exit 1
          }
          version="$(git show "$candidate:features/versions.json" | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>process.stdout.write(JSON.parse(s).currentVersion))')"
          test "$version" = "11.6.3" || {
            echo "::error::Candidate version is not 11.6.3."
            exit 1
          }
          successful="$(gh api -X GET "/repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs" \
            -f head_sha="$candidate" -f status=completed -f per_page=40 \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          test "$successful" -ge 1 || {
            echo "::error::Exact release commit is not validated on main."
            exit 1
          }

      - name: Dispatch protected production promotion workflow
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run promote-release.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Requested existing protected promotion for immutable v11.6.3."
