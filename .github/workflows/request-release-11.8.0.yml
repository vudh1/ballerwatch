name: Request BallerWatch 11.8.0 production promotion

# One-time user-authorized request. Existing protected promotion workflow alone
# owns release/tag/production, Worker audit and Pages deployment.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/request-release-11.8.0.yml"

permissions:
  contents: read

jobs:
  request:
    if: "startsWith(github.event.head_commit.message, 'chore(release): request 11.8.0 production promotion')"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact release candidate, full index and quiet encrypted smoke
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::Missing RELEASE_GITHUB_TOKEN"; exit 1; }
          candidate="$(git log -1 --format=%H HEAD -- features/versions.json)"
          test "$candidate" = "7bc19dc9b7f352c16abc45eaceeccdb6ec529b00" || {
            echo "::error::v11.8.0 release candidate changed; refusing automatic request."
            exit 1
          }
          version="$(git show "$candidate:features/versions.json" |
            node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>process.stdout.write(JSON.parse(s).currentVersion))')"
          test "$version" = "11.8.0" || { echo "::error::Wrong release version"; exit 1; }

          require_green() {
            local workflow="$1"
            local event="$2"
            local successful
            successful="$(gh api -X GET "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f head_sha="$candidate" -f status=completed -f per_page=60 \
              --jq "[.workflow_runs[] | select(.conclusion == \"success\" and .event == \"$event\")] | length")"
            test "$successful" -ge 1 || {
              echo "::error::No passing $workflow run for $candidate ($event)"
              exit 1
            }
          }
          require_green validate.yml push
          require_green pro-sports.yml push
          require_green sports-readonly-smoke.yml workflow_run

      - name: Request protected production release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run promote-release.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Requested guarded v11.8.0 production promotion after verified full index and read-only smoke."
