name: Manual smoke test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "listener/**"
      - "pickup/**"
      - "league/**"
      - "shared/**"
      - "watchdog/**"
      - "infra/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ballerwatch-manual-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pull runtime fixtures from Cloudflare KV
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node shared/runtime-state.mjs pull pickup
          node shared/runtime-state.mjs pull league

      - name: Refresh live pickup source
        env:
          UPSTREAM_ENDPOINT: ${{ secrets.UPSTREAM_ENDPOINT }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_RSVP_NAME: ${{ secrets.OWNER_RSVP_NAME }}
        run: node pickup/update.mjs

      - name: Prepare league runtime
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          TEAM_COUNT="$(node shared/league-teams.mjs list-count)"
          if [ "$TEAM_COUNT" -gt 0 ]; then
            node shared/league-teams.mjs prepare
            node shared/league-state.mjs prepare
            (cd league && /usr/bin/time -f "leagueWatcherSeconds=%e" python3 watcher.py)
          else
            echo "No league teams configured; league live test skipped."
          fi

      - name: Verify refreshed data without notifications
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_RSVP_NAME: ${{ secrets.OWNER_RSVP_NAME }}
        run: node manual-test.mjs

      - name: Verify disabled external fallback posture
        env:
          CRON_JOB_ORG_API_KEY: ${{ secrets.CRON_JOB_ORG_API_KEY }}
        run: node infra/external-schedules.mjs check-disabled

      - name: Remove all transient runtime data
        if: always()
        run: |
          node shared/runtime-state.mjs clean pickup || true
          node shared/runtime-state.mjs clean league || true
          rm -rf .runtime
          rm -f league/teams.json
          rm -f league/schedule.json league/today.json league/calendar-snapshot.json
          rm -f league/score-changes.json league/calendar-changes.json league/telegram-update.json league/status.json
