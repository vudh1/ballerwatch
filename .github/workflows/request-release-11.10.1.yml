name: Request BallerWatch 11.10.1 production promotion

# One-time owner-authorized request. Protected promotion owns tagged release,
# encrypted runtime migration, Cloudflare Worker and GitHub Pages deployment.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/request-release-11.10.1.yml"

permissions:
  contents: read

jobs:
  request:
    if: "startsWith(github.event.head_commit.message, 'chore(release): request 11.10.1 production promotion')"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify immutable candidate and green main-branch release tests
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::Missing release token"; exit 1; }
          candidate="$(git log -1 --format=%H HEAD -- features/versions.json)"
          test "$candidate" = "12db6101ba0374e23514172c4f6d37197ef23c87" || {
            echo "::error::v11.10.1 release candidate changed; refusing promotion."
            exit 1
          }
          version="$(git show "$candidate:features/versions.json" |
            node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>process.stdout.write(JSON.parse(s).currentVersion))')"
          test "$version" = "11.10.1" || { echo "::error::Wrong release version"; exit 1; }
          passing="$(gh api -X GET "/repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs" \
            -f head_sha="$candidate" -f status=completed -f per_page=50 \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "push")] | length')"
          test "$passing" -ge 1 || {
            echo "::error::No passing main Validate code run for $candidate"
            exit 1
          }

      - name: Dispatch existing guarded production promotion
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run promote-release.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Requested protected BallerWatch v11.10.1 production promotion."
