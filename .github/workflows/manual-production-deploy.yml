name: One-time deploy promoted production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-production-deploy.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch production workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-telegram-webhook.yml --repo "$GITHUB_REPOSITORY" --ref main
