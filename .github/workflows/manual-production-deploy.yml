name: One-time deploy promoted production

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-production-deploy.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch production workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in             pages.yml             deploy-telegram-webhook.yml             web-app.yml             weather-refresh.yml             deploy-apps-script.yml             setup-cron.yml
          do
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
          done
