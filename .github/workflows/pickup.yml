name: Pickup watcher

on:
  workflow_dispatch:
    inputs:
      external_fallback:
        description: "Set by the enabled cron-job.org failover dispatcher"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ballerwatch-pickup
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Gate external fallback against Cloudflare health
        id: gate
        env:
          EXTERNAL_FALLBACK: ${{ inputs.external_fallback }}
          TELEGRAM_WEBHOOK_HEALTH_URL: https://ballerwatch-telegram.vudhone.workers.dev/health
        run: node infra/fallback-gate.mjs pickup

      - name: Restore encrypted failover state cache
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .runtime/failover/pickup.json
          key: ballerwatch-runtime-pickup-${{ github.run_id }}
          restore-keys: |
            ballerwatch-runtime-pickup-

      - name: Pull GitHub runtime state
        if: steps.gate.outputs.should_run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node shared/runtime-state.mjs pull pickup

      - name: Refresh pickup data
        if: steps.gate.outputs.should_run == 'true'
        env:
          UPSTREAM_ENDPOINT: ${{ secrets.UPSTREAM_ENDPOINT }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node pickup/update.mjs

      - name: Send pickup notifications
        if: steps.gate.outputs.should_run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          OWNER_RSVP_NAME: ${{ secrets.OWNER_RSVP_NAME }}
        run: node pickup/notify.mjs

      - name: Push GitHub runtime state
        if: always() && steps.gate.outputs.should_run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          BALLERWATCH_ALLOW_OFFLINE: ${{ inputs.external_fallback }}
        run: node shared/runtime-state.mjs push pickup

      - name: Refresh weather after pickup schedule change
        if: steps.gate.outputs.should_run == 'true' && hashFiles('.runtime/pickup/weather-refresh-needed') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: |
          node shared/runtime-state.mjs pull weather
          node weather/update.mjs
          node shared/runtime-state.mjs push weather

      - name: Signal installed web app
        if: steps.gate.outputs.should_run == 'true'
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node shared/web-push.mjs send-pending

      - name: Persist Web Push subscription cleanup
        if: always() && steps.gate.outputs.should_run == 'true'
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BALLERWATCH_ALLOW_OFFLINE: ${{ inputs.external_fallback }}
        run: node shared/runtime-state.mjs push pickup

      - name: Build encrypted failover backup
        if: always() && steps.gate.outputs.should_run == 'true'
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node shared/failover-state.mjs save pickup

      - name: Save encrypted failover state cache
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/cache/save@v4
        with:
          path: .runtime/failover/pickup.json
          key: ballerwatch-runtime-pickup-${{ github.run_id }}

      - name: Remove local runtime data
        if: always()
        run: |
          node shared/runtime-state.mjs clean pickup
          rm -rf .runtime
