name: Pickup watcher

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ballerwatch-pickup
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Refresh pickup data
        env:
          UPSTREAM_ENDPOINT: ${{ secrets.UPSTREAM_ENDPOINT }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node pickup/update.mjs

      - name: Send pickup notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          OWNER_RSVP_NAME: ${{ secrets.OWNER_RSVP_NAME }}
        run: node pickup/notify.mjs

      - name: Remove transient private data
        if: always()
        run: rm -rf .runtime

      - name: Persist encrypted pickup snapshots
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- pickup)" ]; then
            echo "No pickup changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- pickup
          git commit -m "Refresh pickup watcher state"
          STATE_COMMIT="$(git rev-parse HEAD)"
          for attempt in 1 2 3 4; do
            git fetch --depth=1 origin main
            git reset --hard origin/main
            if ! git cherry-pick -X theirs "$STATE_COMMIT"; then
              git cherry-pick --abort || true
              echo "Could not replay generated state; retrying ($attempt/4)."
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another workflow; retrying ($attempt/4)."
            sleep $((attempt * 2))
          done
          echo "Failed to persist state after 4 push attempts."
          exit 1
