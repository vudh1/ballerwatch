name: Cleanup merged working branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ballerwatch-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Delete stale working branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          open_heads="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[].head.ref')"
          {
            git ls-remote --heads origin 'refs/heads/release/*'
            git ls-remote --heads origin 'refs/heads/maintenance/*'
            git ls-remote --heads origin 'refs/heads/fix/*'
          } |
            awk '{sub("refs/heads/","",$2); print $2}' |
            sort -u |
            while IFS= read -r branch; do
              if grep -Fxq "$branch" <<< "$open_heads"; then
                echo "Keeping active branch: $branch"
                continue
              fi
              echo "Deleting stale branch: $branch"
              git push --quiet origin --delete "$branch"
            done
