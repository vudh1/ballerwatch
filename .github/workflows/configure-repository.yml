name: Configure repository

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
    steps:
      - name: Require repository admin token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add REPO_ADMIN_TOKEN as a repository secret. It needs Administration: read/write for this repository."
            exit 1
          fi

      - name: Configure repository release workflow
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY" \
            -f description="Privacy-first soccer automation for pickup RSVP and Seattle RATS schedules, with Telegram alerts, Google Calendar sync, and a Cloudflare-first runtime." \
            -F allow_squash_merge=true \
            -F allow_merge_commit=false \
            -F allow_rebase_merge=false \
            -F allow_auto_merge=true \
            -F delete_branch_on_merge=true \
            -f squash_merge_commit_title="PR_TITLE" \
            -f squash_merge_commit_message="PR_BODY"

      - name: Remove old BallerWatch main-protection ruleset
        run: |
          RULESET_ID="$(gh api "repos/$GITHUB_REPOSITORY/rulesets" --jq '.[] | select(.name == "Protect main via pull requests") | .id' | head -n1)"
          if [ -n "$RULESET_ID" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/rulesets/$RULESET_ID"
            echo "Removed old BallerWatch PR-only ruleset."
          else
            echo "No BallerWatch PR-only ruleset is active."
          fi

      - name: Verify repository configuration
        run: |
          gh api "repos/$GITHUB_REPOSITORY" --jq '{description, default_branch}'
          if gh api "repos/$GITHUB_REPOSITORY/rulesets" --jq '.[].name' | grep -Fxq "Protect main via pull requests"; then
            echo "::error::Old BallerWatch PR-only ruleset still exists."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY" --jq '{allow_squash_merge,allow_merge_commit,allow_rebase_merge,allow_auto_merge,delete_branch_on_merge}'
          echo "Direct commits remain possible, but release branches should merge to main with squash merge."
