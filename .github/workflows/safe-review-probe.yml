name: Temporary safe answer review probe

on:
  push:
    branches: [fix/rats-history-records]
    paths:
      - ".github/workflows/safe-review-probe.yml"

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          path: source
      - name: Check out encrypted runtime state
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: runtime-state
          path: runtime
      - name: Print sanitized review only
        working-directory: source
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node scripts/review-feedback.mjs ../runtime
