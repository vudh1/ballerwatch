name: RATS league watcher

on:
  workflow_dispatch:
    inputs:
      external_fallback:
        description: "Set by the enabled cron-job.org failover dispatcher"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ballerwatch-league
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: league
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: production
          fetch-depth: 1

      - name: Gate external fallback against Cloudflare health
        id: gate
        working-directory: .
        env:
          EXTERNAL_FALLBACK: ${{ inputs.external_fallback }}
          BALLERWATCH_WORKER_HEALTH_URL: https://ballerwatch-web.vudhone.workers.dev/health
        run: node infra/fallback-gate.mjs league

      - name: Restore encrypted failover state cache
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .runtime/failover/league.json
          key: ballerwatch-runtime-league-${{ github.run_id }}
          restore-keys: |
            ballerwatch-runtime-league-

      - name: Pull GitHub runtime state
        if: steps.gate.outputs.should_run == 'true'
        working-directory: .
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node shared/runtime-state.mjs pull league

      - name: Prepare encrypted league state
        if: steps.gate.outputs.should_run == 'true'
        working-directory: .
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: |
          node shared/league-teams.mjs prepare
          node shared/league-state.mjs prepare

      - name: Fetch and validate league schedules
        if: steps.gate.outputs.should_run == 'true'
        run: /usr/bin/time -f 'leagueWatcherSeconds=%e' node watcher.mjs

      - name: Compare with applied Calendar snapshot
        if: steps.gate.outputs.should_run == 'true'
        id: calendar_gate
        shell: bash
        run: |
          node calendar-gate.mjs | tee /tmp/calendar-gate.txt
          grep '^needsCalendar=' /tmp/calendar-gate.txt >> "$GITHUB_OUTPUT"
          grep '^pendingCount=' /tmp/calendar-gate.txt >> "$GITHUB_OUTPUT"

      - name: Sync changed matches to Google Calendar
        if: steps.gate.outputs.should_run == 'true' && steps.calendar_gate.outputs.needsCalendar == 'true'
        env:
          GOOGLE_CALENDAR_WEBHOOK_URL: ${{ secrets.GOOGLE_CALENDAR_WEBHOOK_URL }}
          GOOGLE_CALENDAR_WEBHOOK_SECRET: ${{ secrets.GOOGLE_CALENDAR_WEBHOOK_SECRET }}
        run: node google-calendar-sync.mjs

      - name: Record web schedule notification
        if: steps.gate.outputs.should_run == 'true' && steps.calendar_gate.outputs.needsCalendar == 'true'
        run: node web-notify.mjs

      - name: Seal league runtime state
        if: always() && steps.gate.outputs.should_run == 'true'
        working-directory: .
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: |
          node shared/league-state.mjs seal
          rm -f league/teams.json

      - name: Push GitHub runtime state
        if: always() && steps.gate.outputs.should_run == 'true'
        working-directory: .
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          BALLERWATCH_ALLOW_OFFLINE: ${{ inputs.external_fallback }}
        run: node shared/runtime-state.mjs push league

      - name: Refresh weather after league schedule change
        if: always() && steps.gate.outputs.should_run == 'true' && steps.calendar_gate.outputs.needsCalendar == 'true'
        working-directory: .
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: |
          node shared/runtime-state.mjs pull weather
          node weather/update.mjs
          node shared/runtime-state.mjs push weather

      - name: Signal installed web app
        if: steps.gate.outputs.should_run == 'true'
        working-directory: .
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node shared/web-push.mjs send-pending

      - name: Persist Web Push subscription cleanup
        if: always() && steps.gate.outputs.should_run == 'true'
        working-directory: .
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          BALLERWATCH_ALLOW_OFFLINE: ${{ inputs.external_fallback }}
        run: node shared/runtime-state.mjs push league

      - name: Build encrypted failover backup
        if: always() && steps.gate.outputs.should_run == 'true'
        working-directory: .
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node shared/failover-state.mjs save league

      - name: Save encrypted failover state cache
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .runtime/failover/league.json
          key: ballerwatch-runtime-league-${{ github.run_id }}

      - name: Remove local runtime data
        if: always()
        working-directory: .
        run: |
          node shared/runtime-state.mjs clean league
          rm -rf .runtime
          rm -f league/teams.json league/schedule.json league/today.json
          rm -f league/calendar-snapshot.json league/calendar-changes.json
          rm -f league/notification-update.json league/score-changes.json league/status.json

