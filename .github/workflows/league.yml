name: RATS league watcher

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ballerwatch-league
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: league
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Pull runtime state from Cloudflare KV
        working-directory: .
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node shared/runtime-state.mjs pull league

      - name: Prepare encrypted league state
        working-directory: .
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node shared/league-teams.mjs prepare
          node shared/league-state.mjs prepare

      - name: Fetch and validate league schedules
        run: /usr/bin/time -f 'leagueWatcherSeconds=%e' python3 watcher.py

      - name: Notify Telegram about score changes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 telegram_score_notify.py

      - name: Compare with applied Calendar snapshot
        id: calendar_gate
        shell: bash
        run: |
          python3 calendar_gate.py | tee /tmp/calendar-gate.txt
          grep '^needsCalendar=' /tmp/calendar-gate.txt >> "$GITHUB_OUTPUT"
          grep '^pendingCount=' /tmp/calendar-gate.txt >> "$GITHUB_OUTPUT"

      - name: Sync changed matches to Google Calendar
        if: steps.calendar_gate.outputs.needsCalendar == 'true'
        env:
          GOOGLE_CALENDAR_WEBHOOK_URL: ${{ secrets.GOOGLE_CALENDAR_WEBHOOK_URL }}
          GOOGLE_CALENDAR_WEBHOOK_SECRET: ${{ secrets.GOOGLE_CALENDAR_WEBHOOK_SECRET }}
        run: python3 google_calendar_sync.py

      - name: Notify Telegram about successful schedule update
        if: steps.calendar_gate.outputs.needsCalendar == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 telegram_notify.py

      - name: Seal league runtime state
        if: always()
        working-directory: .
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node shared/league-state.mjs seal
          rm -f league/teams.json

      - name: Push runtime state to Cloudflare KV
        if: always()
        working-directory: .
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node shared/runtime-state.mjs push league

      - name: Remove local runtime data
        if: always()
        working-directory: .
        run: |
          node shared/runtime-state.mjs clean league
          rm -f league/teams.json league/schedule.json league/today.json
          rm -f league/calendar-snapshot.json league/calendar-changes.json
          rm -f league/telegram-update.json league/score-changes.json league/status.json
