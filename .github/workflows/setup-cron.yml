name: Configure external cron

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/setup-cron.yml"
  workflow_dispatch:
    inputs:
      cleanup_old_jobs:
        description: "Disable superseded ballerbaywatch/ttf-watcher/rats-league-watcher cron jobs"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Verify required secrets are available
        env:
          CRON_JOB_ORG_API_KEY: ${{ secrets.CRON_JOB_ORG_API_KEY }}
          CRON_GITHUB_PAT: ${{ secrets.CRON_GITHUB_PAT }}
        run: |
          test -n "$CRON_JOB_ORG_API_KEY" || { echo "Missing CRON_JOB_ORG_API_KEY secret"; exit 1; }
          test -n "$CRON_GITHUB_PAT" || { echo "Missing CRON_GITHUB_PAT secret"; exit 1; }

      - name: Create or update cron-job.org jobs
        env:
          CRON_JOB_ORG_API_KEY: ${{ secrets.CRON_JOB_ORG_API_KEY }}
          CRON_GITHUB_PAT: ${{ secrets.CRON_GITHUB_PAT }}
          CLEANUP_OLD_CRON: ${{ github.event_name == 'workflow_dispatch' && inputs.cleanup_old_jobs || 'true' }}
          BALLERWATCH_BRANCH: main
        run: node infra/sync-cron.mjs
