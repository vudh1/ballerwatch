name: Configure external cron

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Published release tag or production ref to use"
        required: false
        default: "production"
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_ref || 'production' }}
          fetch-depth: 1

      - name: Verify required secrets are available
        env:
          CRON_JOB_ORG_API_KEY: ${{ secrets.CRON_JOB_ORG_API_KEY }}
          CRON_GITHUB_PAT: ${{ secrets.CRON_GITHUB_PAT }}
        run: |
          test -n "$CRON_JOB_ORG_API_KEY" || { echo "Missing CRON_JOB_ORG_API_KEY secret"; exit 1; }
          test -n "$CRON_GITHUB_PAT" || { echo "Missing CRON_GITHUB_PAT secret"; exit 1; }

      - name: Ensure cron-job.org failover jobs are enabled
        env:
          CRON_JOB_ORG_API_KEY: ${{ secrets.CRON_JOB_ORG_API_KEY }}
          CRON_GITHUB_PAT: ${{ secrets.CRON_GITHUB_PAT }}
          BALLERWATCH_BRANCH: production
        run: node infra/external-schedules.mjs ensure-enabled-optional

      - name: Verify enabled failover posture
        env:
          CRON_JOB_ORG_API_KEY: ${{ secrets.CRON_JOB_ORG_API_KEY }}
        run: node infra/external-schedules.mjs check-enabled-optional
