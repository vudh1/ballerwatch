name: Purge current data

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PURGE to delete current generated data'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ballerwatch-data-purge
  cancel-in-progress: false

jobs:
  purge:
    if: inputs.confirm == 'PURGE'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Purge BallerWatch Calendar events
        env:
          GOOGLE_CALENDAR_WEBHOOK_URL: ${{ secrets.GOOGLE_CALENDAR_WEBHOOK_URL }}
          GOOGLE_CALENDAR_WEBHOOK_SECRET: ${{ secrets.GOOGLE_CALENDAR_WEBHOOK_SECRET }}
        run: node league/google-calendar-purge.mjs

      - name: Purge GitHub runtime-state branch
        run: node shared/runtime-state.mjs purge

      - name: Reinitialize empty Web Push identity
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node shared/web-push.mjs ensure
          node shared/runtime-state.mjs push web
          node shared/runtime-state.mjs clean web

      - name: Show purge scope
        run: |
          echo "Deleted BallerWatch-managed RATS events from the Calendar bridge."
          echo "Deleted generated runtime files from the runtime-state branch, including pickup/league snapshots, Calendar reconciliation state, watchdog state, chat review history, listener settings, custom league-team state, Web Push subscriptions, and notification-board state."
          echo "Reinitialized a fresh empty encrypted Web Push identity so the PWA can be re-enabled without another deployment."
          echo "League teams bootstrap from the built-in defaults on the next league run."
          echo "Source code, repository/Worker secrets, and unrelated Google Calendar events are not deleted."
          echo "The primary GitHub watcher schedules rebuild current soccer snapshots and Calendar events automatically."
