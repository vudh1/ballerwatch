name: Enable external failover now

on:
  push:
    branches: ["release/2.3.0"]
    paths:
      - ".github/workflows/enable-external-failover-now.yml"

permissions:
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5

      - name: Enable and verify cron-job.org failover
        env:
          CRON_JOB_ORG_API_KEY: ${{ secrets.CRON_JOB_ORG_API_KEY }}
          CRON_GITHUB_PAT: ${{ secrets.CRON_GITHUB_PAT }}
          BALLERWATCH_BRANCH: main
        run: |
          node infra/external-schedules.mjs ensure-enabled
          node infra/external-schedules.mjs check-enabled
