name: Incident runtime-read diagnostic

on:
  push:
    branches: [release/5.8.1]
    paths:
      - ".github/workflows/incident-runtime-read.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Compare GitHub runtime read credentials
        env:
          CRON_TOKEN: ${{ secrets.CRON_GITHUB_PAT }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -u
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/pickup/state/feed.json?ref=runtime-state"
          for pair in "cron:$CRON_TOKEN" "release:$RELEASE_TOKEN"; do
            name="${pair%%:*}"
            token="${pair#*:}"
            if [ -z "$token" ]; then
              echo "$name=missing"
              continue
            fi
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $token" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$url")"
            echo "$name=$status"
          done

      - name: Probe live web runtime
        shell: bash
        run: |
          set -u
          base="https://ballerwatch-telegram.vudhone.workers.dev"
          for path in /health /web/config /web/next-game /web/calendar; do
            body="/tmp/$(echo "$path" | tr '/' '_').json"
            status="$(curl --max-time 15 --silent --show-error \
              --output "$body" --write-out '%{http_code}' "$base$path" || true)"
            summary="$(node - "$body" <<'NODE'
          const fs=require("fs");
          const file=process.argv[2];
          let value={};
          try { value=JSON.parse(fs.readFileSync(file,"utf8")); } catch {}
          process.stdout.write(JSON.stringify({
            ok:value.ok,
            error:value.error,
            version:value.version,
            service:value.service,
            ready:value.ready,
          }));
          NODE
            )"
            echo "$path status=$status payload=$summary"
          done
