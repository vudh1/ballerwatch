name: Request BallerWatch 11.11.2 production promotion

# One-time, user-authorized release request. Only the existing promotion
# workflow may publish the release and advance production. Never from a PR.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/request-release-11.11.2.yml"

permissions:
  contents: read

jobs:
  request:
    if: "startsWith(github.event.head_commit.message, 'chore(release): request 11.11.2 production promotion')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact candidate and completed beta validation
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          CALENDAR_D1_DATABASE_ID: ${{ secrets.CALENDAR_D1_DATABASE_ID }}
          CALENDAR_SYNC_KEY: ${{ secrets.CALENDAR_SYNC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::Missing protected release token"; exit 1; }
          candidate="$(git log -1 --format=%H HEAD -- features/versions.json)"
          test "$candidate" = "2037148491afe0b66e5ba05d93557bdaf73b9b84" || {
            echo "::error::Version-ledger candidate changed; refusing promotion."
            exit 1
          }
          # Do not release newly modified source as part of this administrative request.
          changes="$(git diff --name-only "$candidate" HEAD)"
          test "$changes" = ".github/workflows/request-release-11.11.2.yml" || {
            echo "::error::Unreviewed main changes since validated release candidate."
            exit 1
          }
          version="$(git show "$candidate:features/versions.json" |
            node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>process.stdout.write(JSON.parse(s).currentVersion))')"
          test "$version" = "11.11.2" || { echo "::error::Wrong version"; exit 1; }
          # Calendar D1 provisioning/migrations require separate explicit approval.
          if [ -n "$CALENDAR_D1_DATABASE_ID" ] || [ -n "$CALENDAR_SYNC_KEY" ]; then
            echo "::error::Optional calendar D1 is configured; separate D1 rollout approval is required."
            exit 1
          fi
          passing="$(gh api -X GET "/repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs" \
            -f head_sha="$candidate" -f status=completed -f per_page=30 \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "push")] | length')"
          test "$passing" -ge 1 || {
            echo "::error::No passing main validation for $candidate."
            exit 1
          }
          pages="$(gh api -X GET "/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs" \
            -f head_sha="$candidate" -f status=completed -f per_page=30 \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "workflow_run")] | length')"
          test "$pages" -ge 1 || {
            echo "::error::Validated beta must be deployed and live-verified before production."
            exit 1
          }
          release="$(gh release view v11.11.2 --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq 'if .isDraft then "draft" else "published" end' \
            2>/dev/null || printf 'missing')"
          test "$release" != "published" || {
            echo "::error::Release already published; do not dispatch twice."
            exit 1
          }

      - name: Dispatch existing protected promotion workflow
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run promote-release.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Requested protected BallerWatch 11.11.2 promotion; no direct production ref changes."
