name: Diagnose live standings (read-only)
on:
  push:
    branches: [fix/10.0.1-standings]
    paths:
      - '.github/workflows/diagnose-standings.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standings:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public service and standings contracts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://ballerwatch-web.vudhone.workers.dev';
          for (const path of ['/health','/web/config','/web/teams','/web/standings','/web/standings?teams=Third%20Touch%20FC','/web/calendar']) {
            try {
              const start=Date.now();
              const response=await fetch(base+path,{headers:{Origin:'https://vudh1.github.io'},signal:AbortSignal.timeout(12000)});
              const text=await response.text();
              let body={};
              try {body=JSON.parse(text)} catch {}
              // Deliberately log no private response bodies, teams, roster or fixture details.
              console.log(JSON.stringify({path,status:response.status,ms:Date.now()-start,
                ok:body.ok,ready:body.ready,error:String(body.error||'').slice(0,250),
                cards:Array.isArray(body.standings?.cards)?body.standings.cards.length:null,
                seasonId:body.standings?.seasonId||null,
                directoryCount:Array.isArray(body.teams)?body.teams.length:null,
                calendarOk:!!body.calendar?.startDate,
                version:body.version||null}));
            } catch (e) { console.log(JSON.stringify({path,error:String(e?.message||e).slice(0,200)})); }
          }
          NODE
