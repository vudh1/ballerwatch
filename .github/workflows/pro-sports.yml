name: Refresh professional sports fixtures
on:
  # The first backfill is built from the validated integration branch.
  # Ordinary scheduled refreshes and post-release runs use production code.
  push:
    branches: [main]
    paths:
      - "backend/sports/index.mjs"
      - ".github/workflows/pro-sports.yml"
  schedule:
    - cron: '37 9 * * 1'
  workflow_dispatch:
  workflow_run:
    workflows: ["Promote production release"]
    types: [completed]
permissions:
  contents: write
# Sports source indexing must not lose its weekly run to frequent league
# dispatches. Runtime-state snapshot writes are optimistic/lease-guarded and
# merge canonical files atomically with bounded retries.
concurrency:
  group: ballerwatch-sports
  cancel-in-progress: false
jobs:
  sports:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'push' && 'main' || 'production' }}
          fetch-depth: 1
      - name: Pull last verified encrypted sport snapshot
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node backend/shared/runtime-state.mjs pull sports
      - name: Update public professional fixture index
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node backend/sports/index.mjs
      - name: Publish encrypted professional fixture index
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node backend/shared/runtime-state.mjs push sports
      - name: Clean local encrypted state
        if: always()
        run: |
          node backend/shared/runtime-state.mjs clean sports
          rm -rf .runtime
