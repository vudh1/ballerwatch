name: Request BallerWatch 11.11.0 production promotion

# One-time user-authorized release request; the existing guarded promotion
# workflow alone owns production refs, GitHub Release, Worker and Pages rollout.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/request-release-11.11.0.yml"

permissions:
  contents: read

jobs:
  request:
    if: "startsWith(github.event.head_commit.message, 'chore(release): request 11.11.0 production promotion')"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Enforce exact reviewed candidate and green release gates
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "::error::Missing release token"; exit 1; }
          candidate="$(git log -1 --format=%H HEAD -- features/versions.json)"
          test "$candidate" = "f43b28a015e6a82be91805c00f0ccfe12780339d" || {
            echo "::error::Release ledger candidate moved; refusing promotion."
            exit 1
          }
          version="$(git show "$candidate:features/versions.json" |
            node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>process.stdout.write(JSON.parse(s).currentVersion))')"
          test "$version" = "11.11.0" || { echo "::error::Wrong release version"; exit 1; }
          passing="$(gh api -X GET "/repos/$GITHUB_REPOSITORY/actions/workflows/validate.yml/runs" \
            -f head_sha="$candidate" -f status=completed -f per_page=50 \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "push")] | length')"
          test "$passing" -ge 1 || {
            echo "::error::No passing main Validate code run for $candidate"; exit 1;
          }
          smoke="$(gh api -X GET "/repos/$GITHUB_REPOSITORY/actions/runs/40260180209" --jq '.conclusion')"
          test "$smoke" = "success" || {
            echo "::error::Required notification-silent encrypted runtime smoke is not green"; exit 1;
          }
          indexed="$(gh api -X GET "/repos/$GITHUB_REPOSITORY/actions/workflows/pro-sports.yml/runs" \
            -f head_sha="$candidate" -f status=completed -f per_page=50 \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "push")] | length')"
          test "$indexed" -ge 1 || {
            echo "::error::Reviewed candidate annual professional fixture backfill has not passed"; exit 1;
          }

      - name: Dispatch the existing protected promotion workflow
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run promote-release.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Requested protected BallerWatch v11.11.0 promotion."
