name: Publish wiki

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/publish-wiki.yml"

permissions:
  contents: write

concurrency:
  group: ballerwatch-wiki-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5

      - name: Clone GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" /tmp/ballerwatch-wiki

      - name: Mirror docs/wiki into GitHub Wiki
        run: |
          set -euo pipefail
          find /tmp/ballerwatch-wiki -maxdepth 1 -type f -name '*.md' -delete
          cp docs/wiki/*.md /tmp/ballerwatch-wiki/
          git -C /tmp/ballerwatch-wiki add -A

          if git -C /tmp/ballerwatch-wiki diff --cached --quiet; then
            echo "Wiki is already current."
            exit 0
          fi

          git -C /tmp/ballerwatch-wiki config user.name "github-actions[bot]"
          git -C /tmp/ballerwatch-wiki config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/ballerwatch-wiki commit -m "Sync BallerWatch wiki from main"
          git -C /tmp/ballerwatch-wiki push origin HEAD:master
