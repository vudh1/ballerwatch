name: Evaluate RATS scouting candidate

# Read-only weekly walk-forward audit. Historical game details are never
# logged or uploaded and a new model cannot silently replace production.
on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scouting-evaluation.yml'
      - 'backend/league/scouting-evaluation.mjs'
      - 'backend/shared/scout-calibration.mjs'

permissions:
  contents: read

concurrency:
  group: ballerwatch-scouting-evaluation
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Read encrypted canonical RATS history
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node backend/shared/runtime-state.mjs pull league

      - name: Replay full seasons and independent holdout
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node backend/league/scouting-evaluation.mjs

      - name: Remove encrypted working copy
        if: always()
        run: |
          node backend/shared/runtime-state.mjs clean league
          rm -rf .runtime
