name: Evaluate RATS scouting candidate

# Weekly independent evaluation and encrypted gated model preparation.
# Public aggregates only reach AI; no notifications or Calendar mutations.
on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
  workflow_run:
    workflows: ["Promote production release"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: ballerwatch-league
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: production

      - name: Read encrypted canonical RATS history
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node backend/shared/runtime-state.mjs pull league

      - name: Prepare measured dual-provider model proposals
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node backend/league/scouting-model.mjs

      - name: Rebuild hourly projections using eligible weights
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node backend/league/scouting-index.mjs

      - name: Publish encrypted model and projections
        env:
          TRACKER_STATE_KEY: ${{ secrets.TRACKER_STATE_KEY }}
        run: node backend/shared/runtime-state.mjs push league

      - name: Remove encrypted working copy
        if: always()
        run: |
          node backend/shared/runtime-state.mjs clean league
          rm -rf .runtime
